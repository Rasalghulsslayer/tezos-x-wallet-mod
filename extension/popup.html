<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TezosX Relayer</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06060c;
      --surface: rgba(15, 15, 28, 0.85);
      --surface-hover: rgba(20, 20, 38, 0.95);
      --border: rgba(108, 71, 255, 0.1);
      --border-hover: rgba(108, 71, 255, 0.3);
      --accent: #7c5cff;
      --accent-soft: rgba(108, 71, 255, 0.12);
      --cyan: #00c2ff;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #475569;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.1);
      --danger-border: rgba(239, 68, 68, 0.25);
      --testnet: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    }

    body {
      width: 360px;
      min-height: 160px;
      max-height: 520px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* ── App layout ── */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(108,71,255,0.06) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      height: 28px;
      width: 28px;
      border-radius: var(--radius-xs);
    }

    header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #a890ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .header-version {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .testnet-pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(245, 158, 11, 0.15);
      color: var(--testnet);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 20px;
      padding: 2px 8px;
    }

    .count-pill {
      font-size: 10px;
      font-weight: 600;
      background: var(--accent-soft);
      color: #a890ff;
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 12px;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      justify-content: center;
      padding: 32px 0;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Session list ── */
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 4px 24px rgba(108, 71, 255, 0.08);
      transform: translateY(-1px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 14px 8px;
    }

    .card-origin {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .icon-muted { color: var(--text-muted); flex-shrink: 0; }

    .origin-text {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chain-pill {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.03em;
      background: rgba(0, 194, 255, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(0, 194, 255, 0.2);
      border-radius: 20px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .time-ago {
      font-size: 10px;
      color: var(--text-dim);
    }

    .card-body {
      padding: 4px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ── Address row ── */
    .addr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: var(--radius-xs);
      background: rgba(0, 0, 0, 0.25);
    }

    .addr-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .addr-logo {
      width: 12px;
      height: 12px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .addr-value {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .copy-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ── Card footer ── */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      padding: 0 14px 10px;
    }

    .btn-disconnect {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font);
      padding: 5px 12px;
      border: 1px solid var(--danger-border);
      background: var(--danger-soft);
      color: var(--danger);
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-disconnect:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* ── Onboarding ── */
    .onboarding {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 16px;
      text-align: center;
    }

    .onboarding-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 14px;
    }

    .onboarding h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, #a890ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .onboarding-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      margin-bottom: 16px;
    }

    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-align: left;
    }

    .step-n {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font);
      padding: 10px 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: white;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .empty-hint {
      font-size: 11px !important;
      font-weight: 400 !important;
      color: var(--text-dim) !important;
      margin-top: 4px;
    }

    .empty-hint code {
      font-family: var(--mono);
      font-size: 10px;
      background: var(--accent-soft);
      color: #a890ff;
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-dim);
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-link:hover { color: var(--accent); }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card, .onboarding, .empty {
      animation: fadeIn 0.25s ease-out both;
    }

    .session-list .card:nth-child(2) { animation-delay: 0.05s; }
    .session-list .card:nth-child(3) { animation-delay: 0.1s; }
    .session-list .card:nth-child(4) { animation-delay: 0.15s; }
    .session-list .card:nth-child(5) { animation-delay: 0.2s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
